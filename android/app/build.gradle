plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fcapps.bff'
    compileSdk 36

    defaultConfig {
        applicationId "com.fcapps.bff"
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName "3.14"
    }

    def buildDate = new Date().format('yyyyMMdd')

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def verNum = String.format("%03d", variant.versionCode)
            outputFileName = "BFF-ver${verNum}-${buildDate}-${variant.buildType.name}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { test ->
            test.systemProperty 'screens.dir', "${project.buildDir}/reports/screens"
            test.systemProperty 'robolectric.graphicsMode', 'NATIVE'
        }
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
